# ============================================================
# 热点数据缓存预热与缓存一致性保障系统 - 配置文件
# ============================================================
# 服务器配置
server:
  port: 8081

spring:
  # ========== 数据源配置（MySQL + Druid 连接池）==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cache_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: "${MYSQL_PASSWORD:your-mysql-password}"   # 本机真实密码见 local-secret.txt（不入库）
    # Druid 连接池参数
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  # ========== Redis 配置 ==========
  # 使用 Windows 本机 Redis 服务（服务名 rediszt3，nssm 注册，开机自启）
  # 注意：该 Redis 设置了 requirepass，必须填密码；只监听 127.0.0.1，勿改成 WSL IP
  # （WSL2 IP 直连会被 Hyper-V 防火墙拦截，ping 通但 TCP 不通，勿再踩坑）
  redis:
    host: 127.0.0.1
    port: 6379
    password: "${REDIS_PASSWORD:your-redis-password}"   # 本机真实密码见 local-secret.txt（不入库）
    database: 0         # 使用 0 号数据库
    timeout: 5000ms     # 连接超时时间
    lettuce:
      pool:
        max-active: 20  # 连接池最大连接数
        max-idle: 10
        min-idle: 5

# ========== MyBatis 配置 ==========
mybatis:
  mapper-locations: classpath:mapper/*.xml   # Mapper XML 文件路径
  type-aliases-package: com.jyu.cache.entity  # 实体类别名扫描包
  configuration:
    map-underscore-to-camel-case: true       # 开启驼峰命名映射（product_name -> productName）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印 SQL 日志

# ========== 自定义缓存配置 ==========
cache:
  # 缓存 key 前缀，所有 Redis key 都会以此为前缀，方便区分
  prefix: "cache:product"
  # 缓存过期时间（秒），30 分钟 = 1800 秒
  ttl: 1800
  # 缓存穿透防护：空值缓存过期时间（秒），60 秒
  null-ttl: 60
  # 延迟双删：第二次删除延迟时间（毫秒），1.5 秒
  delay-delete-ms: 1500
  # 缓存预热：启动时预加载的热点商品数量（按 view_count 降序取前 N 条）
  preheat-count: 10

# ========== 日志配置 ==========
logging:
  level:
    com.jyu.cache: debug
    com.jyu.cache.mapper: debug

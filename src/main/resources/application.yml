# ============================================================
# 热点数据缓存预热与缓存一致性保障系统 v3 - 配置文件
# ============================================================
# 【工程化约定】所有环境相关/敏感配置一律走环境变量占位符：
#   MYSQL_HOST / MYSQL_PORT / MYSQL_DATABASE / MYSQL_USERNAME / MYSQL_PASSWORD
#   REDIS_HOST / REDIS_PORT / REDIS_PASSWORD / REDIS_DATABASE
# 仓库内永远不出现真实密码（本地开发值见 local-secret.txt，该文件已被 .gitignore）。
# 本地开发（PowerShell）示例：
#   $env:MYSQL_PASSWORD="..."; $env:REDIS_PASSWORD="..."; .\mvnw.cmd spring-boot:run
# Docker 部署：见 docker-compose.yml，变量由 compose 注入。
# ============================================================
server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: cache-preheat-system

  # ========== 数据源（MySQL + Druid）==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cache_db_v3}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:请通过环境变量注入MySQL密码}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  # ========== Flyway：数据库版本化迁移 ==========
  # 应用启动时自动执行 classpath:db/migration 下的 V*.sql（按版本号顺序），
  # 已执行过的记录进 flyway_schema_history 表，改表结构只需新增 V2__xxx.sql。
  # clean-disabled=true：禁用破坏性 clean（绝不自动删库）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

  # ========== Redis（Spring Boot 3.x 前缀 spring.data.redis.*）==========
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 5000ms

# ========== MyBatis ==========
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jyu.cache.entity
  configuration:
    map-underscore-to-camel-case: true

# ========== 缓存策略参数（全部可用 CACHE_* 环境变量覆盖）==========
cache:
  prefix: "cache:product"
  ttl: 1800
  ttl-random-seconds: 300
  null-ttl: 60
  delay-delete-ms: 1500
  preheat-count: 10
  lock-wait-ms: 3000
  hot-rank-max-size: 200
  hot-rank-ttl-days: 7
  auto-preheat-interval-ms: 60000

# ========== 应用级配置 ==========
app:
  # CORS 白名单（逗号分隔）；默认 * 方便演示，生产请设置具体来源
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 待支付订单超时分钟数（超时自动取消并回补库存）
  order:
    timeout-minutes: ${ORDER_TIMEOUT_MINUTES:30}

# ========== Actuator：健康检查与运维端点 ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true   # 暴露 /actuator/health/liveness 与 /readiness（K8s 探针）
  health:
    redis:
      enabled: true
    db:
      enabled: true

# ========== 日志：控制台 + 文件（按天 + 大小切割）==========
logging:
  level:
    com.jyu.cache: info
    com.jyu.cache.mapper: debug
  file:
    name: logs/cache-app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB

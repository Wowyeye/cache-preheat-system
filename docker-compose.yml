# ============================================================
# v3 一键编排：MySQL 8 + Redis 7 + 应用
# 启动：docker compose up -d --build
# 探活：应用 readiness 就绪后才有依赖就绪语义（healthcheck + depends_on condition）
# 密码全部走 .env（见 .env.example），仓库不提交真实值
# ============================================================

services:

  mysql:
    image: mysql:8.0
    container_name: cache-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cache_db_v3}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" | grep -q 'is alive'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "13306:3306"   # 宿主机 13306，避免与本机 Windows MySQL 3306 冲突

  redis:
    image: redis:7-alpine
    container_name: cache-redis
    restart: unless-stopped
    # 与 .env 的 REDIS_PASSWORD 联动：有密码则 requirepass，无密码则直启
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes; else exec redis-server --appendonly yes; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "16379:6379"   # 宿主机 16379，避免与本机 Windows Redis 6379 冲突

  app:
    build:
      context: .
      # 国内网络可将 Maven 换源（见 .env.example；留空则走官方源）
      args:
        MVNW_REPOURL: ${MVNW_REPOURL:-}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    container_name: cache-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cache_db_v3}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ORDER_TIMEOUT_MINUTES: ${ORDER_TIMEOUT_MINUTES:-30}
    ports:
      - "8083:8083"
    volumes:
      - app-logs:/app/logs

volumes:
  mysql-data:
  redis-data:
  app-logs:
